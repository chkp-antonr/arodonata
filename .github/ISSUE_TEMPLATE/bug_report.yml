name: Bug Report
description: Report a bug in arodonata
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: arodonata version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >-
        Paste any relevant logs or tracebacks. Remove any credentials,
        internal hostnames, or customer-identifying information first.
      render: shell
