[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "checkpoint-automation-cli"
version = "0.1.0"
description = "Check Point Security Management / MDSM automation project built on Arodonata v2 and arlogi"
requires-python = ">=3.13"
dependencies = [
    "arodonata>=2.6.7",
    "arlogi>=0.1.0",
]

[project.scripts]
cp-tool = "checkpoint_automation_cli.main:main"

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
