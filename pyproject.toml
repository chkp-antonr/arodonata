[project]
name = "arodonata"
version = "2.0.0a0"
description = "Async-first Python 3.13+ library and SDK for Check Point Security Management and MDSM operations"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Anton R." }
]
dependencies = [
    "aiohttp>=3.11.0",
    "aiosqlite>=0.20.0",
    "arlogi>=0.1.0",
    "jsonschema>=4.23.0",
    "opentelemetry-api>=1.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "sqlmodel>=0.0.22",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.30.0",
]
mcp = [
    "mcp>=1.2.0",
    "starlette>=0.41.0",
    "uvicorn>=0.34.0",
]
all = [
    "asyncpg>=0.30.0",
    "mcp>=1.2.0",
    "starlette>=0.41.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
arodonata-mcp = "arodonata.mcp.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "types-jsonschema>=4.23.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arodonata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
packages = ["arodonata"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "arlogi.*",
    "asyncpg.*",
]
ignore_missing_imports = true
