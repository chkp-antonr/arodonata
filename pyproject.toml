[project]
name = "arodonata"
version = "2.1.1"
description = "Async-first Python 3.13+ library and SDK for Check Point Security Management and MDSM operations"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Anton Razumov", email = "arazumov@checkpoint.com" }
]
keywords = [
    "checkpoint",
    "api",
    "async",
    "mdsm",
    "management",
    "security",
    "mcp",
    "policy-as-code",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking :: Firewalls",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.11.0",
    "aiosqlite>=0.20.0",
    "arlogi>=0.1.0",
    "jsonschema>=4.23.0",
    "opentelemetry-api>=1.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "sqlmodel>=0.0.22",
]

[project.optional-dependencies]
otel = [
    "arlogi[otel]>=0.1.0",
]
postgres = [
    "asyncpg>=0.30.0",
]
mcp = [
    "mcp>=1.2.0",
    "starlette>=0.41.0",
    "uvicorn>=0.34.0",
]
all = [
    "arlogi[otel]>=0.1.0",
    "asyncpg>=0.30.0",
    "mcp>=1.2.0",
    "starlette>=0.41.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
arodonata-mcp = "arodonata.mcp.cli:main"

[project.urls]
Homepage = "https://github.com/chkp-antonr/arodonata"
Repository = "https://github.com/chkp-antonr/arodonata"
Documentation = "https://github.com/chkp-antonr/arodonata/tree/master_v2/docs"

[dependency-groups]
dev = [
    "arlogi[otel]>=0.1.0",
    "asyncpg>=0.30.0",
    "commitizen>=4.1.0",
    "fastapi>=0.115.0",
    "mcp>=1.2.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.9.0",
    "starlette>=0.41.0",
    "types-jsonschema>=4.23.0",
    "types-pyyaml>=6.0.12",
    "uvicorn>=0.34.0",
    "mkdocs-git-revision-date-localized-plugin>=1.5.0",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocs-material>=9.7.1",
    "mkdocs-gen-files>=0.5.0,<0.6.1",
    "mkdocs-literate-nav>=0.6.0,<0.6.3",
    "mkdocstrings>=1.0.0",
    "mkdocstrings-python>=1.16.2",
    "pymdown-extensions>=10.19.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arodonata"]

[tool.commitizen]
name = "cz_conventional_commits"
version_scheme = "pep440"
version_provider = "pep621"
version_files = [
    "pyproject.toml:^version",
    "src/arodonata/__init__.py:__version__",
    "tests/unit/test_smoke.py:__version__",
]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: live Check Point MDSM integration test (deselected by default)",
    "bucket_1: Bucket 1 - auth, sessions, read/search, rate limiting",
    "bucket_2: Bucket 2 - cache build + CPCRUD engine",
    "bucket_3: Bucket 3 - publish, revert, throttling",
    "bucket_4: Bucket 4 - multi-domain + cache mode matrix",
    "bucket_5: Bucket 5 - rulebase, large layer, change report",
    "bucket_6: Bucket 6 - soak / stability",
    "bucket_7: Bucket 7 - MCP server and tools",
    "cp_mutates: test mutates live Check Point state (relies on session revert)",
]
addopts = ["-v", "-ra", "--strict-markers", "-m", "not integration"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
packages = ["arodonata"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "arlogi.*",
]
ignore_missing_imports = true
