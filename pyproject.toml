[project]
name = "arodonata"
version = "1.7.0"
description = "Comprehensive Python library for Check Point management and monitoring operations with async support, automatic session management, and intelligent caching. v2"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Anton Razumov", email = "arazumov@checkpoint.com" }]
keywords = [
    "checkpoint",
    "api",
    "async",
    "monitoring",
    "management",
    "security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]

dependencies = [
    "aiohttp>=3.9.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "arlogi>=0.611.0",
    "opentelemetry-api>=1.30.0",
    "cp-mgmt-api-sdk>=1.9.0",
    "jsonschema>=4.21.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "sqlmodel>=0.0.27",
    "rich>=14.2.0",
    "pytest>=9.0.2",
]

[project.optional-dependencies]
otel = ["arlogi[otel]>=0.611.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "ty>=0.0.5",
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "dependency-injector>=4.41.0",
    "mkdocs-git-revision-date-localized-plugin>=1.5.0",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocs-material>=9.7.1",
    "mkdocs-gen-files>=0.5.0,<0.6.1",
    "mkdocs-literate-nav>=0.6.0,<0.6.3",
    "mkdocs-print-site-plugin>=2.7.3",
    "mkdocstrings>=1.0.0",
    "mkdocstrings-python>=1.16.2",
    "pymdown-extensions>=10.19.1",
    "icecream>=2.1.8",
    "aioresponses>=0.7.0",
    "httpx>=0.28.1",
    "cryptography>=41.0.0",
    "commitizen>=4.1.0",
    "pre-commit>=4.0.0",
    "arlogi[otel]>=0.611.0",
    # "checkpoint-mock-api",
]

[project.urls]
Homepage = "https://github.com/chkp-antonr/arodonata"
Repository = "https://github.com/chkp-antonr/arodonata"
Documentation = "https://github.com/chkp-antonr/arodonata/tree/master/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arodonata"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--cov=arodonata",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=85",
    "-m",
    "not integration",
]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: real-environment tests against the FPCR lab (excluded by default)",
    "tier_fast: integration fast tier (<~5 min total) — auto-applied from tests/integration/fast/",
    "tier_medium: integration medium tier (<~30 min cumulative) — auto-applied from tests/integration/medium/",
    "tier_full: integration full tier (hours) — auto-applied from tests/integration/full/",
    "cp_mutates: mutates CP state; triggers baseline revert at session end",
]
filterwarnings = [
    "ignore:ssl.PROTOCOL_TLS is deprecated:DeprecationWarning",
    "ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited:RuntimeWarning",
]

[tool.coverage.run]
source = ["src/arodonata"]
branch = true
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.13"
mypy_path = ["./src"]
# Relaxed settings for better compatibility
strict = false
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
disallow_any_generics = false
check_untyped_defs = false
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
exclude = ["tests/.*"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false


[[tool.mypy.overrides]]
module = ["cpapi"]
ignore_missing_imports = true


[tool.pyright]
exclude = [
    "tests/**",
    ".venv",
    "**/tests/**",
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
]
reportMissingImports = "warning"

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.7.0"
version_files = [
    "pyproject.toml:^version",
    "src/arodonata/__init__.py:__version__",
]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
