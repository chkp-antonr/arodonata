default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.1.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # CI's lint-and-test job runs `uv run mypy src/`, and a type error there
  # fails the build after the push. Run the same check locally, through the
  # project venv (uv) rather than a pinned mirror, so the version that gates
  # the commit is the version CI uses.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (src/)
        entry: uv run mypy src/
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: ["-r", "src/", "-ll"]

  - repo: https://github.com/semgrep/semgrep
    rev: v1.169.0
    hooks:
      - id: semgrep
        args: ["--config=p/owasp-top-ten"]
